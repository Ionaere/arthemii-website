name: Apply kinetic remove patch

on:
  push:
    branches: [kinetic-remove]
    paths: ['kr-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary kr-update/kinetic-remove.patch
          git rm -q video-files/kinetic/kinetic-07.mp4 video-files/kinetic/kinetic-07.jpg video-files/kinetic/kinetic-09.mp4 video-files/kinetic/kinetic-09.jpg
          git rm -r -q kr-update
          git add -A
          git commit -m "Kinetic Prizm: remove two stretched videos (07, 09)"
          git push
