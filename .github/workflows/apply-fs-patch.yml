name: Apply falling shadows patch

on:
  push:
    branches: [falling-shadows-etv]
    paths: ['fs-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary fs-update/falling-shadows.patch
          git rm -r -q fs-update
          git add -A
          git commit -m "Enter the Void prisms: Falling Shadows (not kinetic)"
          git push
