name: Apply gallery layout patch

on:
  push:
    branches: [gallery-layout]
    paths: ['gl-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary gl-update/gallery-layout.patch
          git rm -r -q gl-update
          git add -A
          git commit -m "Gallery photo pages: fixed corner arrows, fluid photo size, smaller tall photos"
          git push
