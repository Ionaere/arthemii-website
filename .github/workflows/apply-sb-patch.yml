name: Apply space bar bottom patch

on:
  push:
    branches: [space-bar-bottom]
    paths: ['sb-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary sb-update/space-bar.patch
          git rm -r -q sb-update
          git add -A
          git commit -m "3D space: smaller theme bar at the bottom; AI themes: AI and AI architecture only"
          git push
