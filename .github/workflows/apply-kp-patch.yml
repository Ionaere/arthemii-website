name: Apply kp-2024.patch

on:
  push:
    branches: [kp-2024]
    paths: ['kp-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary kp-update/kp-2024.patch
          git rm -r -q kp-update
          git add -A
          git commit -m "Kinetic Prizm: year 2024"
          git push
