name: Apply space autotour patch

on:
  push:
    branches: [space-autoflight]
    paths: ['at-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary at-update/space-autotour.patch
          git rm -r -q at-update
          git add -A
          git commit -m "3D space: slow automatic tour after 3 s idle, videos first"
          git push
