name: Apply gallery captions patch

on:
  push:
    branches: [gallery-captions]
    paths: ['gc-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary gc-update/gallery-captions.patch
          git rm -r -q gc-update
          git add -A
          git commit -m "Small captions on gallery photos (home page and /gallery/)"
          git push
