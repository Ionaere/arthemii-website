name: Apply etv photo patch

on:
  push:
    branches: [remove-etv-photo]
    paths: ['ep-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary ep-update/etv-photo.patch
          git rm -q img/2024-05-Screenshot-2024-05-25-at-16.50.20-1.jpg img/2024-05-Screenshot-2024-05-25-at-16.50.20-1.png img/opt/2024-05-Screenshot-2024-05-25-at-16.50.20-1-1600.jpg img/opt/2024-05-Screenshot-2024-05-25-at-16.50.20-1-1600.webp img/opt/2024-05-Screenshot-2024-05-25-at-16.50.20-1-2400.webp img/opt/2024-05-Screenshot-2024-05-25-at-16.50.20-1-800.webp 
          git rm -r -q ep-update
          git add -A
          git commit -m "Remove the Enter the Void photo Screenshot 16.50.20 everywhere (pages, data, 3D space, files)"
          git push
