name: Apply sections center patch

on:
  push:
    branches: [sections-center]
    paths: ['sce-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary sce-update/sections-center.patch
          git rm -r -q sce-update
          git add -A
          git commit -m "Home page: sections zoom in strongly from the centre with a longer, softer ease"
          git push
