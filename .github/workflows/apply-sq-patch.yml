name: Apply space quiet patch

on:
  push:
    branches: [space-quiet-ui]
    paths: ['sq-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary sq-update/space-quiet.patch
          git rm -r -q sq-update
          git add -A
          git commit -m "3D space: no auto tour caption; almost invisible joystick on phones"
          git push
