name: Apply sections zoom patch

on:
  push:
    branches: [sections-zoom]
    paths: ['sz-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary sz-update/sections-zoom.patch
          git rm -r -q sz-update
          git add -A
          git commit -m "Home page: stronger section zoom; phones use a reliable glide-and-zoom on appearance"
          git push
