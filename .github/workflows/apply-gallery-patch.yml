name: Apply gallery patch

on:
  push:
    branches: [gallery-cleanup]
    paths: ['gallery-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary gallery-update/gallery.patch
          git rm -r -q gallery-update
          git add -A
          git commit -m "Gallery cleanup: merge duplicates, add descriptions (EN/DE/ES/FR/IT), redirects, flip photo"
          git push
