name: Apply space mobile video patch

on:
  push:
    branches: [space-mobile-video]
    paths: ['sm-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary sm-update/space-mobile.patch
          git rm -r -q sm-update
          git add -A
          git commit -m "3D space: light 960 px clips for phones, videos kept in the page and restarted on touch, tour target video starts early; slightly less zoom"
          git push
