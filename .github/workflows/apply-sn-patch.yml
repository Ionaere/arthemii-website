name: Apply space nav patch

on:
  push:
    branches: [space-nav]
    paths: ['sn-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary sn-update/space-nav.patch
          git rm -r -q sn-update
          git add -A
          git commit -m "3D space: theme bar no longer covers the back button"
          git push
