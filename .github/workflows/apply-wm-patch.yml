name: Apply working moments patch

on:
  push:
    branches: [working-moments]
    paths: ['wm-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary wm-update/working-moments.patch
          git rm -r -q wm-update
          git add -A
          git commit -m "Working moments page (5 languages) with a button in the home Workshop section"
          git push
