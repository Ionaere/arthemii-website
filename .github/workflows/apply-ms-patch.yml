name: Apply mobile smooth patch

on:
  push:
    branches: [mobile-smooth]
    paths: ['ms-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary ms-update/mobile-smooth.patch
          git rm -r -q ms-update
          git add -A
          git commit -m "Home page: smooth section animation on phones (GPU scroll-driven CSS, no per-frame JS)"
          git push
