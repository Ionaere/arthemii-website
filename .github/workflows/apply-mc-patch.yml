name: Apply media columns patch

on:
  push:
    branches: [media-columns]
    paths: ['mc-update/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        run: |
          git config user.name "Gallery Patch Bot"
          git config user.email "bot@arthemii.com"
          git apply --binary mc-update/media-columns.patch
          git rm -r -q mc-update
          git add -A
          git commit -m "Gallery, Drawings, Videos, AI Content: columns that flow past each other on scroll"
          git push
