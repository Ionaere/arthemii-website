async function build(data) {
  await Promise.race([document.fonts.load("300 64px 'Cormorant Garamond'"), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
  // Every work from every part of the site, shuffled and scattered through space: a different flight on every visit
  const all = [];
  data.sections.forEach(s => s.items.forEach(it => { if (it.img || it.clip) all.push({ ...it, section: s.id, kind: it.clip ? 'video' : 'image' }); }));
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  RADIUS = Math.max(14, Math.cbrt(all.length * 260 * 3 / (4 * Math.PI)));
  const placed = [];
  all.forEach(it => {
    let p = new THREE.Vector3();
    for (let tries = 0; tries < 80; tries++) {
      // random point inside a sphere, keeping the middle free for the name
      p.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
      if (p.lengthSq() > 1) { tries--; continue; }
      p.multiplyScalar(RADIUS);
      if (p.length() < 5) continue;
      if (placed.every(q => q.distanceToSquared(p) > 22)) break;
    }
    placed.push(p.clone());
    addFrame(it, p.x, p.y, p.z, Math.random() * 6.28);
  });
  // The name floats in the middle
  title = new THREE.Mesh(new THREE.PlaneGeometry(9, 1.7), new THREE.MeshBasicMaterial({ map: textTex('Arthemii Ionaere', { size: 150, w: 1600, h: 300, weight: 300, color: '#ffffff', sub: L.welcome, subColor: '#b9a8ff' }), transparent: true, depthWrite: false }));
  scene.add(title);
  buildRoom();   // prism view: no star dots, only the works and their reflections
  applyMode();
  // Start just outside the cloud of works, looking into it
  camera.position.set(0, 0, Math.min(RADIUS + 7, ROOM_IN - 1));
}

    T.seg = null;
    if (!buildSeg()) { stopTour(); return; }
    seg = T.seg; seg.s = rest;
  }
  segPoint(seg, seg.s, camera.position);
  if (tanNow.lengthSq() > 1e-8) T.tan.copy(tanNow).normalize();
  const u = seg.s / seg.len, o = T.works[2];
  if (u > 0.3) upgradeImage(o);
  // the view turns from the work just passed to the next one, early in the leg, so it has settled before arriving
  const A = T.look0 && T.look0.group ? anglesTo(T.look0) : T.look0, B = anglesTo(o);
  const w = smooth(0.04, 0.6, u);
  const wantYaw = A.yaw + wrapA(B.yaw - A.yaw) * w, wantPitch = A.pitch + (B.pitch - A.pitch) * w;
  // a critically damped spring with a speed limit: the turn starts and ends softly and is never fast
  const errY = wrapA(wantYaw - yaw), errP = wantPitch - pitch;
  T.yawV += (TURN_W * TURN_W * errY - 2 * TURN_W * T.yawV) * dt;
  T.pitchV += (TURN_W * TURN_W * errP - 2 * TURN_W * T.pitchV) * dt;
  const tm = kalLike(mode) ? TURN_MAX * 0.45 : TURN_MAX;   // in the mirrors every turn is multiplied: turn slower
  T.yawV = Math.max(-tm, Math.min(tm, T.yawV));
  T.pitchV = Math.max(-tm * 0.6, Math.min(tm * 0.6, T.pitchV));
  yaw = wrapA(yaw + T.yawV * dt);
  pitch = Math.max(-1.2, Math.min(1.2, pitch + T.pitchV * dt));
  camera.rotation.set(pitch, yaw, 0);
}
// nobody touches anything for 3 seconds: the tour starts (again)
function idleCheck(now) {
  if (tour || !lastInput || drag || joy.id !== null || wheelPush) return;
  for (const k in keys) if (keys[k]) return;
  if (focus && !focus.done) return;
  if (now - lastInput > (focus ? IDLE_FOCUS : IDLE_START)) startTour();
}
// any key, click, touch or wheel hands the controls back at once; moving the mouse only keeps the tour from starting
const poke = () => { lastInput = performance.now(); if (tour) stopTour(); };
['keydown', 'pointerdown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, poke, { capture: true, passive: true }));
addEventListener('pointermove', e => { if (!tour && e.pointerType === 'mouse') lastInput = performance.now(); }, { passive: true });
addEventListener('touchmove', () => { lastInput = performance.now(); }, { passive: true });

// The theme bar
const nav = $('sections');
CATS.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = CAT_L[i]; b.dataset.cat = c;
  if (c === cat) b.classList.add('is-on');
  b.addEventListener('click', () => {
    cat = c;
    nav.querySelectorAll('button').forEach(x => x.classList.toggle('is-on', x === b));
    b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    // switching theme mid-flight keeps the current speed and direction, so the flight bends over smoothly
    const carry = tour ? { head: tour.tan.clone(), speed: tour.speed, yawV: tour.yawV, pitchV: tour.pitchV } : null;
    if (tour) endTour();
    plan = null;
    startTour(carry);
    el.focus();
  });
  nav.appendChild(b);
});
window.__spaceTour = () => tour ? 'on ' + plan.cat + ' ' + plan.i + ' ' + plan.done.size : 'off';


/* ---------- keep it smooth: lower the sharpness a little when the device cannot keep up ---------- */
// phones have dense screens: never drop below 1.5x there, or everything turns soft
const PR_MAX = Math.min(devicePixelRatio || 1, 2), PR_MIN = Math.min(isTouch ? 1.5 : 1, PR_MAX);
let pr = PR_MAX, slowT = 0, fastT = 0;
function adaptQuality(dt) {
  if (dt > 0.021) { slowT += dt; fastT = 0; } else if (dt < 0.0145) { fastT += dt; slowT = Math.max(0, slowT - dt * 0.5); }
  let next = pr;
  if (slowT > 0.8 && pr > PR_MIN) { next = Math.max(PR_MIN, pr - 0.25); slowT = 0; }
  else if (fastT > 4 && pr < PR_MAX) { next = Math.min(PR_MAX, pr + 0.25); fastT = 0; }
  if (next !== pr) { pr = next; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); }
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), upV = new THREE.Vector3(0, 1, 0), target = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  // turning with the left / right arrows
  const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  yaw += turn * 1.9 * dt;
  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
  const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  const u = (keys.KeyE || keys.Space ? 1 : 0) - (keys.KeyQ || keys.KeyC ? 1 : 0);
  const run = keys.ShiftLeft || keys.ShiftRight ? 2.3 : 1;
  // any steering hands control back after flying up to a work
  if (focus && (f || s || u || turn || wheelPush)) focus = null;
  if (tour) {
    tourTick(dt);
    vel.set(0, 0, 0);
  } else if (focus) {
    focus.t = Math.min(1, focus.t + dt / 0.9);
    const e = focus.t < 0.5 ? 4 * focus.t * focus.t * focus.t : 1 - Math.pow(-2 * focus.t + 2, 3) / 2;
    camera.position.lerpVectors(focus.from, focus.to, e);
    const p = focus.o.group.position;
    const dx = p.x - camera.position.x, dy = p.y - camera.position.y, dz = p.z - camera.position.z;
    let dyaw = Math.atan2(-dx, -dz) - focus.yaw0;
    dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
    yaw = focus.yaw0 + dyaw * e;
    pitch = focus.pitch0 + (Math.atan2(dy, Math.hypot(dx, dz)) - focus.pitch0) * e;
    camera.rotation.set(pitch, yaw, 0);
    vel.set(0, 0, 0);
    if (focus.t >= 1) focus.done = true;
  } else {
    // looking around eases in softly instead of following the mouse jerkily
    const ease = 1 - Math.exp(-dt * 14);
    lookYaw += Math.atan2(Math.sin(yaw - lookYaw), Math.cos(yaw - lookYaw)) * ease;
    lookPitch += (pitch - lookPitch) * ease;
    camera.rotation.set(lookPitch, lookYaw, 0);
    // fly where you look: up, down, any direction
    camera.getWorldDirection(fwd);
    right.crossVectors(fwd, upV).normalize();
    target.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(right, s).addScaledVector(upV, u);
    if (target.lengthSq() > 1) target.normalize();
    target.multiplyScalar(4.6 * run * (kalLike(mode) ? 0.5 : 1));   // the works are packed closer in the kaleidoscope
    if (wheelPush) { target.addScaledVector(fwd, wheelPush * 6); wheelPush *= 0.82; if (Math.abs(wheelPush) < 0.02) wheelPush = 0; }
    vel.lerp(target, 1 - Math.pow(0.002, dt));
    camera.position.addScaledVector(vel, dt);
  }
  if (tour || focus) { lookYaw = yaw; lookPitch = pitch; }
  // prism view: stay inside the glass prism; cosmos and kaleidoscope: stay near the works.
  // Coming back from outside (after switching the view) is a soft glide, not a jump.
  const cp = camera.position, soft = 1 - Math.pow(0.02, dt);
  if (mode === 'prism') {
    const hr = Math.hypot(cp.x, cp.z), y = Math.max(-ROOM_H + 1.8, Math.min(ROOM_H + ROOM_R * 0.25, cp.y));
    const k = hr > ROOM_IN ? ROOM_IN / hr : 1;
    const out = hr > ROOM_IN + 0.5 || Math.abs(y - cp.y) > 0.5;
    if (out) { cp.x += (cp.x * k - cp.x) * soft; cp.z += (cp.z * k - cp.z) * soft; cp.y += (y - cp.y) * soft; }
    else { cp.x *= k; cp.z *= k; cp.y = y; }
  } else {
    const maxR = kalLike(mode) ? RADIUS * KAL_PACK + 6 : RADIUS + 28, r = cp.length();
    if (r > maxR + 0.5) cp.multiplyScalar(1 + (maxR / r - 1) * soft);
    else if (r > maxR) cp.multiplyScalar(maxR / r);
  }
  if (mode === 'kaleido') kalRot += dt * KAL_TURN;
  if (mode === 'fractal') { kalDive += dt / KAL_DIVE; kalZoom = kalDive % 1; }

  // works drift a little and always turn their face to you
  const t = now * 0.001;
  for (const o of floaters) {
    if (focus && focus.o === o) { o.group.lookAt(camera.position); continue; }
    if (o.dist !== undefined && o.dist > 45) continue;
    o.group.position.y = o.baseY + Math.sin(t * 0.7 + o.phase) * 0.12;
    o.group.lookAt(camera.position);
  }
  if (title) title.lookAt(camera.position);
  for (const p of planets) p.rotation.y += dt * 0.02;
  if (sky) sky.position.copy(camera.position);

  stream(now);
  hover(now);
  idleCheck(now);
  updateReflections();
  adaptQuality(dt);
  present();
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => {
  for (const o of items) if (o.video) { if (document.hidden) o.video.pause(); else { const p = o.video.play(); if (p && p.catch) p.catch(() => {}); } }
});

/* ---------- start ---------- */
fetch('content.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(build)
  .then(() => {
    stream(performance.now() + 300);
    present();
    requestAnimationFrame(tick);
    // Straight into space: no start screen
    el.focus();
    showHint();
    // nobody touches anything for 3 seconds: the slow automatic tour starts (the idle check runs in every frame)
    if (!lastInput) lastInput = performance.now();
    // every touch or click restarts any video the browser held back (e.g. iPhone in Low Power Mode)
    const kick = () => { for (const o of items) if (o.video && o.video.paused) playV(o.video); };
    addEventListener('pointerdown', kick, { passive: true });
    addEventListener('touchend', kick, { passive: true });
  })
  .catch(err => {
    console.error(err);
    $('errTxt').innerHTML = L.err + '<br><br><a href="' + PREFIX + '/">' + L.site + '</a>';
    $('err').style.display = 'flex';
  });
</script>
