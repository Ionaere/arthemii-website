addEventListener('pointermove', e => { if (!tour && e.pointerType === 'mouse') lastInput = performance.now(); }, { passive: true });
addEventListener('touchmove', () => { lastInput = performance.now(); }, { passive: true });

// The theme bar
const nav = $('sections');
CATS.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = CAT_L[i]; b.dataset.cat = c;
  if (c === cat) b.classList.add('is-on');
  b.addEventListener('click', () => {
    cat = c;
    nav.querySelectorAll('button').forEach(x => x.classList.toggle('is-on', x === b));
    b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    if (tour) { endLeg(); tour = null; }
    plan = null;
    startTour();
    el.focus();
  });
  nav.appendChild(b);
});
window.__spaceTour = () => tour ? 'on ' + plan.cat + ' ' + plan.i + ' ' + plan.done.size : 'off';

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), upV = new THREE.Vector3(0, 1, 0), target = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  // turning with the left / right arrows
  const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  yaw += turn * 1.9 * dt;
  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
  const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  const u = (keys.KeyE || keys.Space ? 1 : 0) - (keys.KeyQ || keys.KeyC ? 1 : 0);
  const run = keys.ShiftLeft || keys.ShiftRight ? 2.3 : 1;
  // any steering hands control back after flying up to a work
  if (focus && (f || s || u || turn || wheelPush)) focus = null;
  if (tour) {
    tourTick(dt);
    vel.set(0, 0, 0);
  } else if (focus) {
    focus.t = Math.min(1, focus.t + dt / 0.9);
    const e = focus.t < 0.5 ? 4 * focus.t * focus.t * focus.t : 1 - Math.pow(-2 * focus.t + 2, 3) / 2;
    camera.position.lerpVectors(focus.from, focus.to, e);
    const p = focus.o.group.position;
    const dx = p.x - camera.position.x, dy = p.y - camera.position.y, dz = p.z - camera.position.z;
    let dyaw = Math.atan2(-dx, -dz) - focus.yaw0;
    dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
    yaw = focus.yaw0 + dyaw * e;
    pitch = focus.pitch0 + (Math.atan2(dy, Math.hypot(dx, dz)) - focus.pitch0) * e;
    camera.rotation.set(pitch, yaw, 0);
    vel.set(0, 0, 0);
    if (focus.t >= 1) focus.done = true;
  } else {
    camera.rotation.set(pitch, yaw, 0);
    // fly where you look: up, down, any direction
    camera.getWorldDirection(fwd);
    right.crossVectors(fwd, upV).normalize();
    target.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(right, s).addScaledVector(upV, u);
    if (target.lengthSq() > 1) target.normalize();
    target.multiplyScalar(4.6 * run);
    if (wheelPush) { target.addScaledVector(fwd, wheelPush * 6); wheelPush *= 0.82; if (Math.abs(wheelPush) < 0.02) wheelPush = 0; }
    vel.lerp(target, 1 - Math.pow(0.002, dt));
    camera.position.addScaledVector(vel, dt);
  }
  // stay inside the sky around the works
  const maxR = RADIUS + 28, r = camera.position.length();
  if (r > maxR) camera.position.multiplyScalar(maxR / r);

  // works drift a little and always turn their face to you
  const t = now * 0.001;
  for (const o of floaters) {
    if (focus && focus.o === o) { o.group.lookAt(camera.position); continue; }
    if (o.dist !== undefined && o.dist > 45) continue;
    o.group.position.y = o.baseY + Math.sin(t * 0.7 + o.phase) * 0.12;
    o.group.lookAt(camera.position);
  }
  if (title) title.lookAt(camera.position);
  for (const p of planets) p.rotation.y += dt * 0.02;
  if (sky) sky.position.copy(camera.position);

  stream(now);
  hover(now);
  idleCheck(now);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => {
  for (const o of items) if (o.video) { if (document.hidden) o.video.pause(); else { const p = o.video.play(); if (p && p.catch) p.catch(() => {}); } }
});

/* ---------- start ---------- */
fetch('content.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(build)
  .then(() => {
    stream(performance.now() + 300);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
    // Straight into space: no start screen
    el.focus();
    showHint();
    // nobody touches anything for 3 seconds: the slow automatic tour starts (the idle check runs in every frame)
    if (!lastInput) lastInput = performance.now();
    // every touch or click restarts any video the browser held back (e.g. iPhone in Low Power Mode)
    const kick = () => { for (const o of items) if (o.video && o.video.paused) playV(o.video); };
    addEventListener('pointerdown', kick, { passive: true });
    addEventListener('touchend', kick, { passive: true });
  })
  .catch(err => {
    console.error(err);
    $('errTxt').innerHTML = L.err + '<br><br><a href="' + PREFIX + '/">' + L.site + '</a>';
    $('err').style.display = 'flex';
  });
</script>
