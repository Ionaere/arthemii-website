  cloud(2500, 0.6, 0.8, false);
  cloud(3000, 0.07, 0.75, true);
}
function nebula() {
  // A real photograph of the whole sky (the Milky Way panorama by ESO/S. Brunier), wrapped around you as a sphere
  const geo = new THREE.SphereGeometry(330, 64, 40);
  geo.scale(-1, 1, 1);
  const mat = new THREE.MeshBasicMaterial({ color: 0x000000, fog: false, depthWrite: false });
  sky = new THREE.Mesh(geo, mat);
  sky.renderOrder = -1;
  sky.rotation.set(0.35, 0, 0.6);
  scene.add(sky);
  loader.load('/img/space/milky-way.jpg', tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    mat.map = tex;
    mat.color.set(0xffffff);
    mat.needsUpdate = true;
  });
}

async function build(data) {
  await Promise.race([document.fonts.load('300 64px Hahmlet'), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
  // Every work from every part of the site, shuffled and scattered through space: a different flight on every visit
  const all = [];
  data.sections.forEach(s => s.items.forEach(it => { if (it.img || it.clip) all.push({ ...it, section: s.id, kind: it.clip ? 'video' : 'image' }); }));
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  RADIUS = Math.max(14, Math.cbrt(all.length * 260 * 3 / (4 * Math.PI)));
  const placed = [];
  all.forEach(it => {
    let p = new THREE.Vector3();
    for (let tries = 0; tries < 80; tries++) {
      // random point inside a sphere, keeping the middle free for the name
      p.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
      if (p.lengthSq() > 1) { tries--; continue; }
      p.multiplyScalar(RADIUS);
      if (p.length() < 5) continue;
      if (placed.every(q => q.distanceToSquared(p) > 22)) break;
    }
    placed.push(p.clone());
    addFrame(it, p.x, p.y, p.z, Math.random() * 6.28);
  });
  // The name floats in the middle
  title = new THREE.Mesh(new THREE.PlaneGeometry(9, 1.7), new THREE.MeshBasicMaterial({ map: textTex('Arthemii Ionaere', { size: 150, w: 1600, h: 300, weight: 300, color: '#ffffff', sub: L.welcome, subColor: '#b9a8ff' }), transparent: true, depthWrite: false }));
  scene.add(title);
  stars();
  nebula();
  // Start just outside the cloud of works, looking into it
  camera.position.set(0, 0, RADIUS + 7);
}

/* ---------- lazy textures and videos ---------- */
const LOAD_R = 30, UNLOAD_R = 48, PLAY_R = 9, STOP_R = 13, MAX_PLAYING = 4, HEAVY_R = 5.5;
let loadingCount = 0;
function loadImage(o) {
  if (!o.img || o.state !== 'idle' || loadingCount > 6) return;
  o.state = 'loading';
  loadingCount++;
  loader.load(asset(o.img), tex => {
    loadingCount--;
    if (o.state !== 'loading') { tex.dispose(); return; }
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 4;
    o.tex = tex;
    if (!o.video) o.pic.material = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
    const im = tex.image;
    setSize(o, im.width || 4, im.height || 3);
    addGlow(o, averageColor(im));
    o.group.visible = true;
    o.state = 'ready';
  }, undefined, () => { loadingCount--; o.state = 'failed'; });
}
function unloadImage(o) {
  if (o.state === 'ready' || o.state === 'loading') {
    if (o.tex) { o.tex.dispose(); o.tex = null; }
    if (o.pic.material !== placeholderMat && !o.video) { o.pic.material.dispose(); o.pic.material = placeholderMat; }
    if (!o.video) o.group.visible = false;
    o.state = 'idle';
  }
}
function startVideo(o) {
  if (o.video || !o.clip) return;
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
  v.src = asset(o.clip);
  o.video = v;
  v.addEventListener('loadeddata', () => {
    if (o.video !== v) return;
    const vt = new THREE.VideoTexture(v);
    vt.colorSpace = THREE.SRGBColorSpace;
    o.vtex = vt;
    o.pic.material = new THREE.MeshBasicMaterial({ map: vt, toneMapped: false });
    if (v.videoWidth) setSize(o, v.videoWidth, v.videoHeight);
    o.group.visible = true;
  }, { once: true });
  const p = v.play(); if (p && p.catch) p.catch(() => {});
}
function stopVideo(o) {
  if (!o.video) return;
  const v = o.video; o.video = null;
  v.pause(); v.removeAttribute('src'); v.load();
  if (o.vtex) { o.vtex.dispose(); o.vtex = null; }
  if (o.pic.material !== placeholderMat) { o.pic.material.dispose(); }
  o.pic.material = o.tex ? new THREE.MeshBasicMaterial({ map: o.tex, toneMapped: false }) : placeholderMat;
  if (!o.tex) o.group.visible = false;
}
let lastStream = 0;
function stream(now) {
  if (now - lastStream < 250) return;
  lastStream = now;
  const near = [];
  for (const o of items) {
    const dist = o.group.position.distanceTo(camera.position);
    o.dist = dist;
    if (dist < LOAD_R) loadImage(o);
    else if (dist > UNLOAD_R) unloadImage(o);
    if (o.clip) {
      if (dist < PLAY_R) near.push([dist, o]);
      else if (dist > STOP_R) stopVideo(o);
    }
  }
  near.sort((a, b) => a[0] - b[0]);
  // Short clips play in a wider circle; full-length films only right in front of you, one at a time
  let n = 0, heavy = 0;
  near.forEach(([dist, o]) => {
    const ok = o.heavy ? (dist < HEAVY_R && heavy < 1) : n < MAX_PLAYING;
    if (ok) { startVideo(o); if (o.heavy) heavy++; else n++; }
    else stopVideo(o);
  });
}

/* ---------- movement ---------- */
const keys = {};
let yaw = 0, pitch = 0, glide = null;
const vel = new THREE.Vector3();
addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') { if (focus) focus = null; else $('back').click(); }
  glide = null;
  hideHint();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const el = renderer.domElement;
let drag = null;
el.addEventListener('pointerdown', e => {
  el.focus();
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
});
el.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true;
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; hideHint(); }
  if (drag.moved) {
    const k = isTouch ? 0.0055 : 0.0038;
    yaw += dx * k;
    pitch = Math.max(-1.45, Math.min(1.45, pitch + dy * k));
    glide = null;
    focus = null;
  }
});
el.addEventListener('pointerup', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const d = drag; drag = null;
  if (!d.moved && performance.now() - d.t < 600) clickAt(e.clientX, e.clientY);
});
el.addEventListener('pointercancel', () => { drag = null; });
el.addEventListener('pointerleave', () => { mouse.in = false; });
el.addEventListener('wheel', e => { e.preventDefault(); wheelPush += Math.sign(e.deltaY) * -0.9; glide = null; }, { passive: false });
let wheelPush = 0;

// Touch joystick
const stick = $('stick'), knob = stick.querySelector('i');
const joy = { x: 0, y: 0, id: null };
stick.addEventListener('pointerdown', e => { joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); moveJoy(e); hideHint(); glide = null; e.stopPropagation(); });
stick.addEventListener('pointermove', e => { if (joy.id === e.pointerId) moveJoy(e); });
const endJoy = () => { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', endJoy);
stick.addEventListener('pointercancel', endJoy);
function moveJoy(e) {
  const r = stick.getBoundingClientRect();
  let x = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), y = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  joy.x = x; joy.y = y;
  knob.style.transform = `translate(${x * 34}px, ${y * 34}px)`;
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster();
const mouse = { x: 0, y: 0, in: false };
const ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  ray.far = 16;
  const meshes = [];
  for (const o of items) { if (o.dist !== undefined && o.dist < 40) { meshes.push(o.pic); meshes.push(o.back); } }
  const hit = ray.intersectObjects(meshes, false)[0];
  return hit ? hit.object.userData.item : null;
}
// First click: fly up to the work until it almost fills the screen. Second click: open its page.
let focus = null;
function flyTo(o) {
  const p = o.group.position;
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), fill = 0.9;
  const d = Math.max(o.h / fill / (2 * half), o.w / fill / (2 * half * camera.aspect)) + 0.02;
  const dir = new THREE.Vector3().subVectors(camera.position, p);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
  dir.normalize();
  focus = { o, from: camera.position.clone(), to: p.clone().addScaledVector(dir, d), yaw0: yaw, pitch0: pitch, t: 0, done: false };
  vel.set(0, 0, 0);
  hideHint();
}
function clickAt(x, y) {
  const o = pick(x, y);
  if (!o) return;
  if (focus && focus.o === o && focus.done) { leave(pageUrl(o.url)); return; }
  flyTo(o);
}
const tip = $('tip');
let hoverT = 0;
function hover(now) {
  if (isTouch || !mouse.in || drag) { tip.classList.remove('is-on'); el.style.cursor = drag ? 'grabbing' : 'grab'; return; }
  if (now - hoverT < 60) return;
  hoverT = now;
  const o = pick(mouse.x, mouse.y);
  if (o) {
    el.style.cursor = 'pointer';
    tip.innerHTML = '';
    const b = document.createElement('b'); b.textContent = o.t || '';
    const s = document.createElement('small'); s.textContent = (focus && focus.o === o && focus.done) ? L.open + ' →' : ZOOM;
    tip.append(b, s);
    tip.style.left = mouse.x + 'px'; tip.style.top = mouse.y + 'px';
    tip.classList.add('is-on');
  } else {
    el.style.cursor = 'grab';
    tip.classList.remove('is-on');
  }
}

/* ---------- hint ---------- */
let hintTimer = null;
function showHint() { $('hint').classList.remove('is-hidden'); clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 9000); }
function hideHint() { $('hint').classList.add('is-hidden'); }

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), upV = new THREE.Vector3(0, 1, 0), target = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  // turning with the left / right arrows
  const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  yaw += turn * 1.9 * dt;
  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
  const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  const u = (keys.KeyE || keys.Space ? 1 : 0) - (keys.KeyQ || keys.KeyC ? 1 : 0);
  const run = keys.ShiftLeft || keys.ShiftRight ? 2.3 : 1;
  // any steering hands control back after flying up to a work
  if (focus && (f || s || u || turn || wheelPush)) focus = null;
  if (focus) {
    focus.t = Math.min(1, focus.t + dt / 0.9);
    const e = focus.t < 0.5 ? 4 * focus.t * focus.t * focus.t : 1 - Math.pow(-2 * focus.t + 2, 3) / 2;
    camera.position.lerpVectors(focus.from, focus.to, e);
    const p = focus.o.group.position;
    const dx = p.x - camera.position.x, dy = p.y - camera.position.y, dz = p.z - camera.position.z;
    let dyaw = Math.atan2(-dx, -dz) - focus.yaw0;
    dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
    yaw = focus.yaw0 + dyaw * e;
    pitch = focus.pitch0 + (Math.atan2(dy, Math.hypot(dx, dz)) - focus.pitch0) * e;
    camera.rotation.set(pitch, yaw, 0);
    vel.set(0, 0, 0);
    if (focus.t >= 1) focus.done = true;
  } else {
    camera.rotation.set(pitch, yaw, 0);
    // fly where you look: up, down, any direction
    camera.getWorldDirection(fwd);
    right.crossVectors(fwd, upV).normalize();
    target.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(right, s).addScaledVector(upV, u);
    if (target.lengthSq() > 1) target.normalize();
    target.multiplyScalar(4.6 * run);
    if (wheelPush) { target.addScaledVector(fwd, wheelPush * 6); wheelPush *= 0.82; if (Math.abs(wheelPush) < 0.02) wheelPush = 0; }
    vel.lerp(target, 1 - Math.pow(0.002, dt));
    camera.position.addScaledVector(vel, dt);
  }
  // stay inside the sky around the works
  const maxR = RADIUS + 28, r = camera.position.length();
  if (r > maxR) camera.position.multiplyScalar(maxR / r);

  // works drift a little and always turn their face to you
  const t = now * 0.001;
  for (const o of floaters) {
    if (focus && focus.o === o) { o.group.lookAt(camera.position); continue; }
    if (o.dist !== undefined && o.dist > 45) continue;
    o.group.position.y = o.baseY + Math.sin(t * 0.7 + o.phase) * 0.12;
    o.group.lookAt(camera.position);
  }
  if (title) title.lookAt(camera.position);
  for (const p of planets) p.rotation.y += dt * 0.02;
  if (sky) sky.position.copy(camera.position);

  stream(now);
  hover(now);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => {
  for (const o of items) if (o.video) { if (document.hidden) o.video.pause(); else { const p = o.video.play(); if (p && p.catch) p.catch(() => {}); } }
});

/* ---------- start ---------- */
fetch('content.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(build)
  .then(() => {
    stream(performance.now() + 300);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
    // Straight into space: no start screen
    el.focus();
    showHint();
    // the first touch or click makes sure every browser lets the videos play
    addEventListener('pointerdown', () => {
      for (const o of items) if (o.video && o.video.paused) { const p = o.video.play(); if (p && p.catch) p.catch(() => {}); }
    }, { once: true });
  })
  .catch(err => {
    console.error(err);
    $('errTxt').innerHTML = L.err + '<br><br><a href="' + PREFIX + '/">' + L.site + '</a>';
    $('err').style.display = 'flex';
  });
</script>
