function canvasTex(w, h, draw) {

  title.rotation.y = Math.PI;
  scene.add(title);
  // Title is seen when turning around; a second one ahead greets the visitor
  let z = zStart - 4;
  const nav = $('sections');
  data.sections.forEach((s, si) => {
    const list = s.items.filter(i => i.img || i.clip);
    if (!list.length) return;
    const z0 = z;
    arch(z0);
    signPlane(L.s[s.id] || s.title || s.id, z0 - 0.4);
    let zi = z0 - 2.6;
    list.forEach((it, i) => {
      const left = i % 2 === 0;
      const slot = Math.floor(i / 2);
      const iz = zi - slot * SP;
      it.kind = it.clip ? 'video' : 'image';
      it.section = s.id;
      addFrame(it, left ? -HALF + 0.04 : HALF - 0.04, iz, left ? Math.PI / 2 : -Math.PI / 2);
    });
    z = zi - Math.ceil(list.length / 2) * SP - 1.2;
    sectionsAt.push({ id: s.id, z0, z1: z });
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = L.s[s.id] || s.title || s.id;
    b.addEventListener('click', () => glideTo(z0 - 1.2));
    b.dataset.id = s.id;
    nav.appendChild(b);
  });
  zEnd = z - 1;
  // End wall: back to the entrance
  const endSign = new THREE.Mesh(new THREE.PlaneGeometry(9, 1.7), new THREE.MeshBasicMaterial({ map: textTex('↺  ' + L.start, { size: 96, w: 1600, h: 300, weight: 300 }), transparent: true }));
  endSign.position.set(0, 2.3, zEnd + 0.06);
  endSign.userData.item = { action: 'start', t: L.start };
  scene.add(endSign);
  items.push({ group: endSign, pic: endSign, back: endSign, label: endSign, action: 'start', t: L.start, z: zEnd, state: 'static' });

  // Room
  const len = zStart + 2 - zEnd;
  const zMid = (zStart + 2 + zEnd) / 2;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, len), new THREE.MeshLambertMaterial({ map: floorTex }));
  floorTex.repeat.set(W / 3, len / 3);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, zMid);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, len), new THREE.MeshLambertMaterial({ color: 0xfbfaf8 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, zMid);
  const wl = new THREE.Mesh(new THREE.PlaneGeometry(len, H), wallMat); wl.rotation.y = Math.PI / 2; wl.position.set(-HALF, H / 2, zMid);
  const wr = new THREE.Mesh(new THREE.PlaneGeometry(len, H), wallMat); wr.rotation.y = -Math.PI / 2; wr.position.set(HALF, H / 2, zMid);
  const we = new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMat); we.position.set(0, H / 2, zEnd);
  const ws = new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMat); ws.rotation.y = Math.PI; ws.position.set(0, H / 2, zStart + 2);
  scene.add(floor, ceil, wl, wr, we, ws);
  // Light strips on the ceiling
  const stripMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const x of [-2.2, 2.2]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.04, len - 2), stripMat);
    s.position.set(x, H - 0.03, zMid);
    scene.add(s);
  }
  // Skirting
  for (const x of [-HALF + 0.02, HALF - 0.02]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, len), darkMat);
    s.position.set(x, 0.06, zMid);
    scene.add(s);
  }
}

/* ---------- lazy textures and videos ---------- */
const LOAD_R = 30, UNLOAD_R = 48, PLAY_R = 9, STOP_R = 13, MAX_PLAYING = 4, HEAVY_R = 5.5;
let loadingCount = 0;
function loadImage(o) {
  if (!o.img || o.state !== 'idle' || loadingCount > 6) return;
  o.state = 'loading';
  loadingCount++;
  loader.load(asset(o.img), tex => {
    loadingCount--;
    if (o.state !== 'loading') { tex.dispose(); return; }
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 4;
    o.tex = tex;
    if (!o.video) o.pic.material = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
    const im = tex.image;
    setSize(o, im.width || 4, im.height || 3);
    if (o.section === 'gallery' || o.section === 'projects' || o.section === 'exhibitions') addGlow(o, averageColor(im));
    o.state = 'ready';
  }, undefined, () => { loadingCount--; o.state = 'failed'; });
}
function unloadImage(o) {
  if (o.state === 'ready' || o.state === 'loading') {
    if (o.tex) { o.tex.dispose(); o.tex = null; }
    if (o.pic.material !== placeholderMat && !o.video) { o.pic.material.dispose(); o.pic.material = placeholderMat; }
    o.state = 'idle';
  }
}
function startVideo(o) {
  if (o.video || !o.clip) return;
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
  v.src = asset(o.clip);
  o.video = v;
  v.addEventListener('loadeddata', () => {
    if (o.video !== v) return;
    const vt = new THREE.VideoTexture(v);
    vt.colorSpace = THREE.SRGBColorSpace;
    o.vtex = vt;
    o.pic.material = new THREE.MeshBasicMaterial({ map: vt, toneMapped: false });
    if (v.videoWidth) setSize(o, v.videoWidth, v.videoHeight);
  }, { once: true });
  const p = v.play(); if (p && p.catch) p.catch(() => {});
}
function stopVideo(o) {
  if (!o.video) return;
  const v = o.video; o.video = null;
  v.pause(); v.removeAttribute('src'); v.load();
  if (o.vtex) { o.vtex.dispose(); o.vtex = null; }
  if (o.pic.material !== placeholderMat) { o.pic.material.dispose(); }
  o.pic.material = o.tex ? new THREE.MeshBasicMaterial({ map: o.tex, toneMapped: false }) : placeholderMat;
}
let lastStream = 0;
function stream(now) {
  if (now - lastStream < 250) return;
  lastStream = now;
  const cz = camera.position.z, cx = camera.position.x;
  const near = [];
  for (const o of items) {
    if (o.state === 'static') continue;
    const d = Math.abs(o.z - cz);
    if (d < LOAD_R) loadImage(o);
    else if (d > UNLOAD_R) unloadImage(o);
    if (o.clip) {
      const dist = Math.hypot(o.z - cz, o.group.position.x - cx);
      if (dist < PLAY_R) near.push([dist, o]);
      else if (dist > STOP_R) stopVideo(o);
    }
  }
  near.sort((a, b) => a[0] - b[0]);
  // Short clips play in a wider circle; full-length films only right in front of you, one at a time
  let n = 0, heavy = 0;
  near.forEach(([dist, o]) => {
    const ok = o.heavy ? (dist < HEAVY_R && heavy < 1) : n < MAX_PLAYING;
    if (ok) { startVideo(o); if (o.heavy) heavy++; else n++; }
    else stopVideo(o);
  });
}

/* ---------- movement ---------- */
const keys = {};
let yaw = 0, pitch = 0, glide = null;
const vel = new THREE.Vector3();
addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') $('back').click();
  glide = null;
  hideHint();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function glideTo(z) { glide = { z: Math.min(zStart, Math.max(zEnd + 1.5, z)), x: 0 }; yaw = 0; }

const el = renderer.domElement;
let drag = null;
el.addEventListener('pointerdown', e => {
  el.focus();
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
});
el.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true;
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; hideHint(); }
  if (drag.moved) {
    const k = isTouch ? 0.0055 : 0.0038;
    yaw += dx * k;
    pitch = Math.max(-0.7, Math.min(0.7, pitch + dy * k));
    glide = null;
  }
});
el.addEventListener('pointerup', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const d = drag; drag = null;
  if (!d.moved && performance.now() - d.t < 600) clickAt(e.clientX, e.clientY);
});
el.addEventListener('pointercancel', () => { drag = null; });
el.addEventListener('pointerleave', () => { mouse.in = false; });
el.addEventListener('wheel', e => { e.preventDefault(); wheelPush += Math.sign(e.deltaY) * -0.9; glide = null; }, { passive: false });
let wheelPush = 0;

// Touch joystick
const stick = $('stick'), knob = stick.querySelector('i');
const joy = { x: 0, y: 0, id: null };
stick.addEventListener('pointerdown', e => { joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); moveJoy(e); hideHint(); glide = null; e.stopPropagation(); });
stick.addEventListener('pointermove', e => { if (joy.id === e.pointerId) moveJoy(e); });
const endJoy = () => { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', endJoy);
stick.addEventListener('pointercancel', endJoy);
function moveJoy(e) {
  const r = stick.getBoundingClientRect();
  let x = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), y = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  joy.x = x; joy.y = y;
  knob.style.transform = `translate(${x * 34}px, ${y * 34}px)`;
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster();
const mouse = { x: 0, y: 0, in: false };
const ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  ray.far = 16;
  const meshes = [];
  for (const o of items) { if (Math.abs(o.z - camera.position.z) < 18) { meshes.push(o.pic); if (o.back !== o.pic) meshes.push(o.back); } }
  const hit = ray.intersectObjects(meshes, false)[0];
  return hit ? hit.object.userData.item : null;
}
function clickAt(x, y) {
  const o = pick(x, y);
  if (!o) return;
  if (o.action === 'start') { glideTo(zStart - 1); return; }
  leave(pageUrl(o.url));
}
const tip = $('tip');
let hoverT = 0;
function hover(now) {
  if (isTouch || !mouse.in || drag) { tip.classList.remove('is-on'); el.style.cursor = drag ? 'grabbing' : 'grab'; return; }
  if (now - hoverT < 60) return;
  hoverT = now;
  const o = pick(mouse.x, mouse.y);
  if (o) {
    el.style.cursor = 'pointer';
    tip.innerHTML = '';
    const b = document.createElement('b'); b.textContent = o.t || '';
    const s = document.createElement('small'); s.textContent = (o.action === 'start' ? '↺' : L.open + ' →');
    tip.append(b, s);
    tip.style.left = mouse.x + 'px'; tip.style.top = mouse.y + 'px';
    tip.classList.add('is-on');
  } else {
    el.style.cursor = 'grab';
    tip.classList.remove('is-on');
  }
}

/* ---------- hint ---------- */
let hintTimer = null;
function showHint() { $('hint').classList.remove('is-hidden'); clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 9000); }
function hideHint() { $('hint').classList.add('is-hidden'); }

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
let curSection = null;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  // turning with arrows
  const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  yaw += turn * 1.9 * dt;
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
  let s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
  const run = keys.ShiftLeft || keys.ShiftRight ? 2.3 : 1;
  const speed = 4.6 * run;
  fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  const target = new THREE.Vector3().addScaledVector(fwd, f).addScaledVector(right, s);
  if (target.lengthSq() > 1) target.normalize();
  target.multiplyScalar(speed);
  if (wheelPush) { target.addScaledVector(fwd, wheelPush * 6); wheelPush *= 0.82; if (Math.abs(wheelPush) < 0.02) wheelPush = 0; }
  vel.lerp(target, 1 - Math.pow(0.0008, dt));
  if (glide) {
    const dz = glide.z - camera.position.z, dx = glide.x - camera.position.x;
    camera.position.z += dz * Math.min(1, dt * 3.2);
    camera.position.x += dx * Math.min(1, dt * 3.2);
    vel.set(0, 0, 0);
    if (Math.abs(dz) < 0.05) glide = null;
  } else {
    camera.position.addScaledVector(vel, dt);
  }
  camera.position.x = Math.max(-HALF + 0.9, Math.min(HALF - 0.9, camera.position.x));
  camera.position.z = Math.max(zEnd + 1.2, Math.min(zStart + 1.2, camera.position.z));
  // gentle head bob while walking
  const sp = vel.length();
  camera.position.y = EYE + Math.sin(now * 0.009) * 0.025 * Math.min(1, sp / 4);
  camera.rotation.set(pitch, yaw, 0);
  if (!drag && sp > 0.3) pitch *= Math.pow(0.35, dt);

  stream(now);
  hover(now);
  for (const o of items) if (o.vtex && o.video && o.video.readyState >= 2) o.vtex.needsUpdate = true;

  // section chips
  const cz = camera.position.z;
  const sec = sectionsAt.find(x => cz <= x.z0 + 0.5 && cz > x.z1);
  const id = sec ? sec.id : null;
  if (id !== curSection) {
    curSection = id;
    document.querySelectorAll('#sections button').forEach(b => b.classList.toggle('is-on', b.dataset.id === id));
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => {
  for (const o of items) if (o.video) { if (document.hidden) o.video.pause(); else { const p = o.video.play(); if (p && p.catch) p.catch(() => {}); } }
});

/* ---------- start ---------- */
camera.position.set(0, EYE, zStart);
fetch('content.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(build)
  .then(() => {
    stream(1e9);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
    const btn = $('enter');
    btn.disabled = false;
    btn.textContent = L.enter;
    const go = () => {
      $('intro').classList.add('is-gone');
      el.focus();
      showHint();
      // a user gesture lets every browser start the videos
      for (const o of items) if (o.video) { const p = o.video.play(); if (p && p.catch) p.catch(() => {}); }
    };
    btn.addEventListener('click', go);
    addEventListener('keydown', function k(e) { if (e.code === 'Enter' || e.code === 'Space') { removeEventListener('keydown', k); go(); } });
  })
  .catch(err => {
    console.error(err);
    $('errTxt').innerHTML = L.err + '<br><br><a href="' + PREFIX + '/">' + L.site + '</a>';
    $('err').style.display = 'flex';
  });
</script>
</body>
</html>
